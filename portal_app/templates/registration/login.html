<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Back! | Admin Login</title>
    <link rel="stylesheet" href="/static/portal_app/login_custom.css">
    <style>
        body { background: #f4f6fb; }
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .login-header {
            background: #174ea6;
            color: #fff;
            padding: 32px 24px 16px 24px;
            text-align: center;
        }
        .login-header .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .login-header h2 {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }
        .login-header p {
            margin: 8px 0 0 0;
            font-size: 16px;
        }
        .login-form {
            padding: 24px;
        }
        .login-form label {
            font-weight: 500;
            margin-bottom: 6px;
        }
        .login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 16px;
        }
        .login-form .error {
            color: #dc3545;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .login-form .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .login-form .actions label {
            font-size: 14px;
        }
        .login-form .actions a {
            font-size: 14px;
            color: #174ea6;
            text-decoration: none;
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg,#174ea6,#1e90ff);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <div class="icon">&#128274;</div>
        <h2>Welcome Back!</h2>
        <p>Login to access your dashboard</p>
    </div>
    <form class="login-form" method="post" action="">
        {% csrf_token %}
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" required>
        {% if form.username.errors %}
            <div class="error">{{ form.username.errors.0 }}</div>
        {% endif %}
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        {% if form.password.errors %}
            <div class="error">{{ form.password.errors.0 }}</div>
        {% endif %}
        <div class="actions">
            <label><input type="checkbox" name="remember"> Remember me</label>
            <a href="/password_reset/">Forgot Password?</a>
        </div>
        <button type="submit">&#128274; Login to Dashboard</button>
    </form>
</div>
</body>
</html>
