{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Digital Gram Panchayat</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="author" content="Digital Gram Panchayat">
    <meta name="robots" content="index, follow">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Premium Auth CSS -->
    <link rel="stylesheet" href="{% static 'portal_app/css/auth-premium.css' %}">
</head>

<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-grid-pattern"></div>
        <div class="container auth-container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8 col-xl-5">
                    <div class="auth-card">
                        <div class="auth-header">
                            <div class="auth-badge"><i class="bi bi-person-fill"></i></div>
                            <h1>Digital Gram Panchayat</h1>
                            <p>Your trusted partner for digital governance</p>
                        </div>

                        {% if messages %}
                        <div class="mb-3">
                            {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message|safe }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                            {% endfor %}
                        </div>
                        {% endif %}

                        <form method="POST" id="loginForm" novalidate>
                            {% csrf_token %}

                            <div class="mb-3 form-group">
                                <label for="id_username" class="field-label">Username or Email *</label>
                                <div class="input-shell">
                                    <i class="bi bi-person input-icon"></i>
                                    <input type="text" id="id_username" name="username" class="form-control" placeholder="Enter username or email" required autocomplete="username">
                                </div>
                                <div class="field-error d-none" data-error-for="id_username"></div>
                            </div>

                            <div class="mb-3 form-group">
                                <label for="id_password" class="field-label">Password *</label>
                                <div class="input-shell">
                                    <i class="bi bi-lock input-icon"></i>
                                    <input type="password" id="id_password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                                    <button type="button" class="password-tools" data-password-toggle="id_password" aria-label="Show password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="field-error d-none" data-error-for="id_password"></div>
                            </div>

                            <div class="auth-meta-row">
                                <label class="remember-wrap">
                                    <input type="checkbox" name="remember_me" id="remember_me">
                                    <span>Remember me</span>
                                </label>
                                <a href="{% url 'forgot_password' %}" class="auth-link">Forgot password?</a>
                            </div>

                            <button type="submit" class="auth-submit" id="loginSubmitBtn">
                                <span class="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                                <span class="btn-loading d-none"><span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Signing in...</span>
                            </button>
                        </form>

                        <div style="text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--auth-border);">
                            <p style="margin: 0 0 12px 0; color: var(--auth-muted); font-weight: 600;">Don't have an account?</p>
                            <a href="{% url 'register' %}" style="display: inline-block; color: var(--auth-primary); text-decoration: none; font-weight: 700; padding: 10px 20px; border-radius: var(--auth-radius-md); background: rgba(91, 92, 240, 0.1); transition: all 0.3s ease;">
                                <i class="bi bi-person-plus-fill me-1"></i>Create Account
                            </a>
                        </div>

                        <div style="text-align: center; margin-top: 16px;">
                            <a href="{% url 'admin_login' %}" style="color: var(--auth-muted); font-size: 0.9rem; text-decoration: none; transition: all 0.3s ease;">
                                <i class="bi bi-shield-lock me-1"></i>Admin Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Auth Premium JS -->
    <script src="{% static 'portal_app/js/auth-premium.js' %}"></script>
    <script src="{% static 'portal_app/js/login-premium.js' %}"></script>
</body>
</html>
